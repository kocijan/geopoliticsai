name: Deploy to GitHub Pages

on:
  # Daily automated refresh of latest Wikipedia & treaty data
  schedule:
    - cron: '0 4 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Deploy automatically when pushing changes to main
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest latest Wikipedia & Frontier AI data
        run: |
          python3 scripts/fetch_wikipedia_data.py

      - name: Generate OG social thumbnail
        run: |
          pip install Pillow
          python3 scripts/generate_thumbnail.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
