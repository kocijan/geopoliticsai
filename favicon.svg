<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0b0f19"/>
  <!-- Globe outline -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#334155" stroke-width="0.8"/>
  <!-- Meridians -->
  <ellipse cx="16" cy="16" rx="5" ry="12" fill="none" stroke="#334155" stroke-width="0.6"/>
  <ellipse cx="16" cy="16" rx="9" ry="12" fill="none" stroke="#334155" stroke-width="0.5"/>
  <!-- Equator + tropics -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#334155" stroke-width="0.6"/>
  <line x1="6" y1="10" x2="26" y2="10" stroke="#334155" stroke-width="0.4"/>
  <line x1="6" y1="22" x2="26" y2="22" stroke="#334155" stroke-width="0.4"/>
  <!-- WAICO red region (left hemisphere) -->
  <circle cx="10" cy="14" r="3" fill="#dc2626" opacity="0.85"/>
  <!-- Pax blue region (right hemisphere) -->
  <circle cx="21" cy="12" r="3.2" fill="#2563eb" opacity="0.85"/>
  <!-- Frontier gold region (bottom) -->
  <circle cx="16" cy="21" r="2.8" fill="#d97706" opacity="0.85"/>
  <!-- Tripartite overlap highlight -->
  <circle cx="16" cy="16" r="1.5" fill="#7c3aed" opacity="0.9"/>
  <!-- Subtle glow ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#3b82f6" stroke-width="0.3" opacity="0.4"/>
</svg>
